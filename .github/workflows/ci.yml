# Pull requests to main: type-check and build every app, and run the package tests. Nothing is deployed.
# Run one package at a time: the rules and play builds both rewrite packages/content/dist, so parallel builds race.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tools run cf-typegen
      - run: pnpm -r --workspace-concurrency=1 build
      - run: pnpm -r --workspace-concurrency=1 --if-present test
