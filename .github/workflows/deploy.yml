name: Deploy

# Every push to main deploys the apps whose inputs changed. "Run workflow" deploys all four.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rules == 'true' }}
      tools: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tools == 'true' }}
      hub: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.hub == 'true' }}
      play: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.play == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rules:
              - apps/rules/**
              - packages/content/**
              - packages/ui/**
              - heart_rush/**
              - world-wikis/**
              - navigation-categories.json
              - gm-navigation-categories.json
              - pnpm-lock.yaml
              - .github/**
            tools:
              - apps/tools/**
              - packages/northlight/**
              - packages/ui/**
              - pnpm-lock.yaml
              - .github/**
            hub:
              - apps/hub/**
              - packages/ui/**
              - pnpm-lock.yaml
              - .github/**
            play:
              - apps/play/**
              - apps/tools/migrations/**
              - packages/content/**
              - packages/northlight/**
              - packages/rules-engine/**
              - packages/ui/**
              - heart_rush/**
              - world-wikis/**
              - navigation-categories.json
              - gm-navigation-categories.json
              - pnpm-lock.yaml
              - .github/**

  # Each job deploys the commit it checked out, which contains every earlier push, so a queued job replaced by a newer one loses nothing.
  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-rules
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter rules run deploy

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-tools
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter tools run db:migrate
      - run: pnpm --filter tools run deploy

  hub:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-hub
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter hub run deploy

  # apps/play/scripts/deploy.ts: tests, build, remote D1 migrations, upload, checks at 0%, promote.
  # Its checks write a short-lived session row into the heartrush-tools D1 database, which the token's D1 Edit permission covers.
  play:
    needs: changes
    if: needs.changes.outputs.play == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-play
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter play run deploy
